<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="月支出">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>月支出小工具</title>
<style>
:root{--bg:#12141c;--card:#1c1f2b;--line:#2c3144;--tx:#e8eaf2;--mu:#8a90a8;--ac:#4fd1c5;--rd:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:520px;margin:auto;padding:14px}h1{font-size:20px;margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.tr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
select,input,button{font:inherit;color:var(--tx);background:#252a3a;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{cursor:pointer}.pri{background:var(--ac);color:#0b1a19;border:0;font-weight:600}.del{color:var(--rd);background:none;border:0;padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 10px}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.sm{color:var(--mu);font-size:12px}.big{font-size:28px;font-weight:700}.mon{display:flex;align-items:center;justify-content:space-between}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}.bar{height:6px;background:var(--ac);border-radius:3px;margin-top:2px}
.coin{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#3a2600;font-weight:700;font-size:13px;padding:6px 14px 6px 6px;border-radius:999px;
background:linear-gradient(135deg,#fff3b0,#f6c453 40%,#d99a1e 75%,#f6d36b);box-shadow:0 2px 10px rgba(246,196,83,.35),inset 0 1px 0 #fff8;position:relative;overflow:hidden}
.coin::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);animation:sh 3.5s infinite}
@keyframes sh{0%,70%{left:-60%}100%{left:130%}}
.ci{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#f6c453 45%,#b87b0e);border:2px solid #fbe08a;box-shadow:inset 0 0 0 2px #c98f1a;display:grid;place-items:center;font-size:14px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:92%;max-width:480px}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}.chk input[type=number]{width:110px}
</style></head><body><div class="w">
<div class="top"><div><h1 data-i="title"></h1><div class="sm" data-i="sub"></div></div>
<div class="tr"><select id="lang"><option value="zh">繁中</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select>
<a class="coin" id="kofi" href="https://ko-fi.com/leestuido" target="_blank" rel="noopener"><span class="ci">☕</span><span data-i="kofi"></span></a></div></div>

<div class="card"><div class="mon"><button id="pm">‹</button><b id="ml"></b><button id="nm">›</button></div>
<div style="text-align:center;margin:10px 0"><div class="sm" data-i="total"></div><div class="big" id="tot"></div></div>
<div class="sum"><div><div class="sm" data-i="fixed"></div><b id="tf"></b></div><div><div class="sm" data-i="variable"></div><b id="tv"></b></div><div><div class="sm" data-i="count"></div><b id="tc"></b></div></div>
<div id="cats" style="margin-top:10px"></div></div>

<div class="card"><h2 data-i="fixed"></h2>
<div class="row"><input id="fn" data-p="name"><input id="fa" type="number" inputmode="decimal" data-p="amount"><select id="fc" class="cs"></select><button class="pri" id="fadd" data-i="add"></button></div>
<div id="fl"></div></div>

<div class="card"><h2 data-i="variable"></h2>
<div class="row"><input id="vd" type="date"><input id="va" type="number" inputmode="decimal" data-p="amount"></div>
<div class="row" style="margin-top:6px"><input id="vn" data-p="note"><select id="vc" class="cs"></select><button class="pri" id="vadd" data-i="add"></button></div>
<div class="row" style="margin-top:8px"><button id="scan" data-i="scan"></button></div><input id="file" type="file" accept="image/*" hidden>
<div class="sm" id="ost"></div><div id="vl"></div></div>
<div class="sm" style="text-align:center" data-i="local"></div></div>

<dialog id="dlg"><h3 data-i="confirm"></h3><div id="cands"></div><div class="row" style="margin-top:10px"><button id="dc" data-i="cancel"></button><button class="pri" id="dok" data-i="addSel"></button></div></dialog>
<dialog id="edlg"><h3 data-i="edit"></h3><div class="row"><input id="en" data-p="name"><input id="ea" type="number" data-p="amount"><select id="ec" class="cs"></select></div><div class="row" style="margin-top:10px"><button id="ecx" data-i="cancel"></button><button class="pri" id="eok" data-i="save"></button></div></dialog>
<script>
const T={
zh:{title:"月支出小工具",sub:"記錄每月固定與不固定支出",kofi:"請我喝咖啡",total:"本月總支出",fixed:"固定支出",variable:"不固定支出",count:"筆數",name:"名稱",amount:"金額",note:"備註",add:"新增",scan:"📷 掃描明細 (OCR)",edit:"編輯",save:"儲存",cancel:"取消",confirm:"確認要新增的金額",addSel:"新增勾選項目",del:"刪除這筆？",empty:"尚無資料",ocrLoad:"辨識中…（首次需下載語言檔）",ocrNone:"找不到金額",ocrErr:"辨識失敗",local:"資料只存在此裝置（localStorage）",need:"請輸入名稱與金額",ym:(y,m)=>`${y} 年 ${m} 月`,cats:{food:"餐飲",home:"居住",trans:"交通",bill:"帳單",shop:"購物",fun:"娛樂",health:"醫療",other:"其他"}},
en:{title:"Monthly Expenses",sub:"Track fixed and variable monthly spending",kofi:"Support on Ko-fi",total:"Total this month",fixed:"Fixed expenses",variable:"Variable expenses",count:"Entries",name:"Name",amount:"Amount",note:"Note",add:"Add",scan:"📷 Scan receipt (OCR)",edit:"Edit",save:"Save",cancel:"Cancel",confirm:"Confirm amounts to add",addSel:"Add selected",del:"Delete this item?",empty:"No data yet",ocrLoad:"Recognizing… (first run downloads language data)",ocrNone:"No amounts found",ocrErr:"Recognition failed",local:"Data is stored only on this device (localStorage)",need:"Enter name and amount",ym:(y,m)=>new Date(y,m-1).toLocaleString('en',{month:'long',year:'numeric'}),cats:{food:"Food",home:"Housing",trans:"Transport",bill:"Bills",shop:"Shopping",fun:"Fun",health:"Health",other:"Other"}},
ja:{title:"月の支出ツール",sub:"毎月の固定費と変動費を記録",kofi:"コーヒーをおごる",total:"今月の合計",fixed:"固定費",variable:"変動費",count:"件数",name:"名前",amount:"金額",note:"メモ",add:"追加",scan:"📷 明細をスキャン (OCR)",edit:"編集",save:"保存",cancel:"キャンセル",confirm:"追加する金額を確認",addSel:"選択を追加",del:"削除しますか？",empty:"データなし",ocrLoad:"認識中…（初回は言語データをダウンロード）",ocrNone:"金額が見つかりません",ocrErr:"認識に失敗しました",local:"データはこの端末のみに保存（localStorage）",need:"名前と金額を入力してください",ym:(y,m)=>`${y}年${m}月`,cats:{food:"食費",home:"住居",trans:"交通",bill:"公共料金",shop:"買い物",fun:"娯楽",health:"医療",other:"その他"}},
ko:{title:"월 지출 도구",sub:"매달 고정·변동 지출 기록",kofi:"커피 한 잔 후원",total:"이번 달 총 지출",fixed:"고정 지출",variable:"변동 지출",count:"건수",name:"이름",amount:"금액",note:"메모",add:"추가",scan:"📷 영수증 스캔 (OCR)",edit:"편집",save:"저장",cancel:"취소",confirm:"추가할 금액 확인",addSel:"선택 항목 추가",del:"삭제할까요?",empty:"데이터 없음",ocrLoad:"인식 중…(처음엔 언어 데이터 다운로드)",ocrNone:"금액을 찾지 못했습니다",ocrErr:"인식 실패",local:"데이터는 이 기기에만 저장됩니다(localStorage)",need:"이름과 금액을 입력하세요",ym:(y,m)=>`${y}년 ${m}월`,cats:{food:"식비",home:"주거",trans:"교통",bill:"공과금",shop:"쇼핑",fun:"여가",health:"의료",other:"기타"}}};
const $=id=>document.getElementById(id);const K='expw1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{fixed:[],vars:[]};let L=localStorage.getItem(K+'lang')||(navigator.language||'zh').slice(0,2);if(!T[L])L='zh';
let cur=new Date();cur.setDate(1);let editId=null;
const save=()=>localStorage.setItem(K,JSON.stringify(S));const t=k=>T[L][k];const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function i18n(){document.documentElement.lang={zh:'zh-Hant',en:'en',ja:'ja',ko:'ko'}[L];document.title=t('title');
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
document.querySelectorAll('.cs').forEach(s=>{const v=s.value;s.innerHTML=Object.entries(t('cats')).map(([k,n])=>`<option value="${k}">${n}</option>`).join('');s.value=v||'other'});$('lang').value=L;render()}
function render(){const m=ym(cur);$('ml').textContent=t('ym')(cur.getFullYear(),cur.getMonth()+1);
const vs=S.vars.filter(v=>v.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));const tf=S.fixed.reduce((a,f)=>a+f.amount,0),tv=vs.reduce((a,v)=>a+v.amount,0);
$('tot').textContent=fmt(tf+tv);$('tf').textContent=fmt(tf);$('tv').textContent=fmt(tv);$('tc').textContent=S.fixed.length+vs.length;
const by={};[...S.fixed,...vs].forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);const mx=Math.max(1,...Object.values(by));
$('cats').innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`<div class="sm" style="display:flex;justify-content:space-between"><span>${t('cats')[c]||c}</span><span>${fmt(a)}</span></div><div class="bar" style="width:${a/mx*100}%"></div>`).join('');
$('fl').innerHTML=S.fixed.map(f=>`<div class="it"><span>${esc(f.name)} <span class="sm">${t('cats')[f.cat]}</span></span><span>${fmt(f.amount)} <button class="del" onclick="ed('${f.id}')">✎</button><button class="del" onclick="rm('fixed','${f.id}')">✕</button></span></div>`).join('')||`<div class="sm">${t('empty')}</div>`;
$('vl').innerHTML=vs.map(v=>`<div class="it"><span>${v.date.slice(5)} ${esc(v.note||'')} <span class="sm">${t('cats')[v.cat]}</span></span><span>${fmt(v.amount)} <button class="del" onclick="rm('vars','${v.id}')">✕</button></span></div>`).join('')||`<div class="sm">${t('empty')}</div>`}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function rm(k,id){if(confirm(t('del'))){S[k]=S[k].filter(x=>x.id!==id);save();render()}}
function ed(id){const f=S.fixed.find(x=>x.id===id);editId=id;$('en').value=f.name;$('ea').value=f.amount;$('ec').value=f.cat;$('edlg').showModal()}
$('eok').onclick=()=>{const f=S.fixed.find(x=>x.id===editId);const a=parseFloat($('ea').value);if(!$('en').value||!(a>0))return alert(t('need'));f.name=$('en').value;f.amount=a;f.cat=$('ec').value;save();render();$('edlg').close()};
$('ecx').onclick=()=>$('edlg').close();
$('fadd').onclick=()=>{const a=parseFloat($('fa').value),n=$('fn').value.trim();if(!n||!(a>0))return alert(t('need'));S.fixed.push({id:uid(),name:n,amount:a,cat:$('fc').value});$('fn').value=$('fa').value='';save();render()};
const today=()=>{const d=new Date();return ym(cur)===ym(d)?ym(d)+'-'+String(d.getDate()).padStart(2,'0'):ym(cur)+'-01'};
$('vadd').onclick=()=>{const a=parseFloat($('va').value);if(!(a>0))return alert(t('need'));S.vars.push({id:uid(),date:$('vd').value||today(),amount:a,note:$('vn').value.trim(),cat:$('vc').value});$('va').value=$('vn').value='';save();render()};
$('pm').onclick=()=>{cur.setMonth(cur.getMonth()-1);$('vd').value=today();render()};$('nm').onclick=()=>{cur.setMonth(cur.getMonth()+1);$('vd').value=today();render()};
$('lang').onchange=e=>{L=e.target.value;localStorage.setItem(K+'lang',L);i18n()};
function loadT(){return window.Tesseract?Promise.resolve():new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)})}
$('scan').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('ost').textContent=t('ocrLoad');
try{await loadT();const {data}=await Tesseract.recognize(f,'chi_tra+eng+jpn+kor');
const found=[];data.text.split('\n').forEach(line=>{(line.replace(/[,，]/g,'').match(/\d+(?:\.\d{1,2})?/g)||[]).forEach(n=>{const v=parseFloat(n);if(v>0&&v<1e7&&!/^(19|20)\d{2}$/.test(n))found.push({v,line:line.trim()})})});
$('ost').textContent='';if(!found.length)return alert(t('ocrNone'));
$('cands').innerHTML=found.slice(0,30).map((c,i)=>`<label class="chk"><input type="checkbox" data-k="${i}"><input type="number" value="${c.v}" id="cv${i}"><span class="sm">${esc(c.line).slice(0,40)}</span></label>`).join('');$('dlg').showModal()}
catch(err){$('ost').textContent=t('ocrErr')}finally{e.target.value=''}};
$('dc').onclick=()=>$('dlg').close();
$('dok').onclick=()=>{document.querySelectorAll('#cands input[type=checkbox]:checked').forEach(c=>{const a=parseFloat($('cv'+c.dataset.k).value);if(a>0)S.vars.push({id:uid(),date:$('vd').value||today(),amount:a,note:'OCR',cat:$('vc').value})});save();render();$('dlg').close()};
$('vd').value=today();i18n();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
